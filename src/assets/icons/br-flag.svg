<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Kék háttér -->
  <rect width="300" height="300" fill="#012169" />

  <!-- Fehér átlós keresztek -->
  <line x1="0" y1="0" x2="300" y2="300" stroke="#FFFFFF" stroke-width="30" />
  <line x1="300" y1="0" x2="0" y2="300" stroke="#FFFFFF" stroke-width="30" />

  <!-- Piros átlós sávok (Szent Patrik kereszt eltolásokkal) -->
  <path d="M 0,0 L 150,150 M 300,0 L 150,150 M 300,300 L 150,150 M 0,300 L 150,150" stroke="#C8102E" stroke-width="10" stroke-dasharray="0,150,150,0" />
  <path d="M 0,0 L 150,150" stroke="#C8102E" stroke-width="10" stroke-dashoffset="-150" />
  <path d="M 300,0 L 150,150" stroke="#C8102E" stroke-width="10" stroke-dashoffset="0" />
  <path d="M 300,300 L 150,150" stroke="#C8102E" stroke-width="10" stroke-dashoffset="-150" />
  <path d="M 0,300 L 150,150" stroke="#C8102E" stroke-width="10" stroke-dashoffset="0" />

  <!-- Egyszerűsített, tiszta átlós piros vonalak a négyzetes arányhoz igazítva -->
  <!-- (A precíz eltolások helyett a négyzetes formában a tiszta törések jobban mutatnak) -->
  <g>
    <path d="M0,0 L120,120 M180,180 L300,300 M300,0 L180,120 M120,180 L0,300" stroke="#C8102E" stroke-width="10" />
  </g>

  <!-- Nagy fehér Szent György kereszt (háttér a pirosnak) -->
  <rect x="110" y="0" width="80" height="300" fill="#FFFFFF" />
  <rect x="0" y="110" width="300" height="80" fill="#FFFFFF" />

  <!-- Nagy piros Szent György kereszt -->
  <rect x="126" y="0" width="48" height="300" fill="#C8102E" />
  <rect x="0" y="126" width="300" height="48" fill="#C8102E" />
</svg>
