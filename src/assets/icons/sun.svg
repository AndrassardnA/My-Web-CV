<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- A napocska csoportja a kontúrokkal és kitöltéssel -->
  <g stroke="#eee" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="#eee">
    
    <!-- Sugarak (Észak, Dél, Kelet, Nyugat) -->
    <line x1="100" y1="20" x2="100" y2="35" />
    <line x1="100" y1="165" x2="100" y2="180" />
    <line x1="20" y1="100" x2="35" y2="100" />
    <line x1="165" y1="100" x2="180" y2="100" />
    
    <!-- Átlós sugarak -->
    <line x1="43.4" y1="43.4" x2="53.1" y2="53.1" />
    <line x1="146.9" y1="146.9" x2="156.6" y2="156.6" />
    <line x1="156.6" y1="43.4" x2="146.9" y2="53.1" />
    <line x1="53.1" y1="146.9" x2="43.4" y2="156.6" />
    
    <!-- Középső kör (Nap teste) -->
    <circle cx="100" cy="100" r="30" />
  </g>
</svg>
