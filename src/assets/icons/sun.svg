<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- A napocska csoportja a kontúrokkal és kitöltéssel -->
  <g stroke="#000000" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="#000">
    
    <!-- Sugarak (Észak, Dél, Kelet, Nyugat) -->
    <line x1="100" y1="20" x2="100" y2="45" />
    <line x1="100" y1="155" x2="100" y2="180" />
    <line x1="20" y1="100" x2="45" y2="100" />
    <line x1="155" y1="100" x2="180" y2="100" />
    
    <!-- Átlós sugarak -->
    <line x1="43.4" y1="43.4" x2="61.1" y2="61.1" />
    <line x1="138.9" y1="138.9" x2="156.6" y2="156.6" />
    <line x1="156.6" y1="43.4" x2="138.9" y2="61.1" />
    <line x1="61.1" y1="138.9" x2="43.4" y2="156.6" />
    
    <!-- Középső kör (Nap teste) -->
    <circle cx="100" cy="100" r="30" />
  </g>
</svg>
